# Server Configuration
server.port=8080

# Spring Application
spring.application.name=fairtrip-service

# Datasource (MySQL default with environment variable fallbacks)
spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:mysql://localhost:3306/fairtrip_db?createDatabaseIfNotExist=true&useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:root}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:root}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# JPA & Hibernate
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect

# Flyway Migrations
spring.flyway.enabled=true
spring.flyway.baseline-on-migrate=true
spring.flyway.locations=classpath:db/migration

# Spring Security & JWT
app.jwt.secret=9a367468165cf9b9da4608c02a76f6de48a3e9c5a146747d6e5a6f29633e387c
app.jwt.expiration-ms=86400000

# Cache Configuration (In-Memory ConcurrentMapCacheManager default)
spring.cache.type=simple

# Actuator Endpoints
management.endpoints.web.exposure.include=health,info,metrics
management.endpoint.health.show-details=always

# Logging
logging.level.root=INFO
logging.level.com.example.fairtrip=DEBUG
logging.pattern.console=%d{yyyy-MM-dd HH:mm:ss} [%thread] %-5level %logger{36} - %msg%n

# Static resource handling for frontend
spring.web.resources.static-locations=classpath:/static/
spring.mvc.static-path-pattern=/**
