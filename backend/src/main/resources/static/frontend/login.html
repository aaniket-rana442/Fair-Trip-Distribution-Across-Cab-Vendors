<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login - Fair Trip Distribution System</title>
    <link rel="stylesheet" href="/css/common.css">
    <link rel="stylesheet" href="/css/forms.css">
    <style>
        .login-wrapper {
            display: flex;
            min-height: 100vh;
            align-items: center;
            justify-content: center;
            background: linear-gradient(135deg, #0f172a 0%, #1e293b 100%);
            padding: 1.5rem;
        }
        .login-card {
            background: #ffffff;
            border-radius: var(--radius-lg);
            box-shadow: 0 20px 25px -5px rgb(0 0 0 / 0.3), 0 8px 10px -6px rgb(0 0 0 / 0.3);
            width: 100%;
            max-width: 440px;
            padding: 2.25rem;
        }
        .login-header {
            text-align: center;
            margin-bottom: 2rem;
        }
        .login-logo {
            font-size: 2.5rem;
            margin-bottom: 0.5rem;
        }
        .login-title {
            font-size: 1.5rem;
            font-weight: 800;
            color: #0f172a;
        }
        .login-subtitle {
            font-size: 0.875rem;
            color: var(--text-muted);
            margin-top: 0.25rem;
        }
        .demo-accounts {
            margin-top: 1.75rem;
            padding-top: 1.5rem;
            border-top: 1px dashed var(--border);
        }
        .demo-title {
            font-size: 0.75rem;
            font-weight: 700;
            text-transform: uppercase;
            letter-spacing: 0.05em;
            color: var(--text-muted);
            margin-bottom: 0.75rem;
            text-align: center;
        }
        .demo-btn-grid {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 0.5rem;
        }
        .btn-demo {
            padding: 0.5rem 0.6rem;
            font-size: 0.775rem;
            font-weight: 600;
            border-radius: var(--radius-sm);
            background: #f8fafc;
            border: 1px solid var(--border);
            cursor: pointer;
            text-align: left;
            transition: all 0.2s;
        }
        .btn-demo:hover {
            background: #f1f5f9;
            border-color: var(--primary);
            color: var(--primary);
        }
        .btn-demo span {
            display: block;
            font-size: 0.7rem;
            font-weight: 400;
            color: var(--text-muted);
        }
    </style>
</head>
<body>

<div class="login-wrapper">
    <div class="login-card">
        <div class="login-header">
            <div class="login-logo">🚖</div>
            <h1 class="login-title">FairTrip Portal</h1>
            <p class="login-subtitle">Fair Trip Distribution & Vendor Management</p>
        </div>

        <form id="login-form">
            <div class="form-group">
                <label class="form-label" for="email">Email Address</label>
                <input type="email" id="email" class="form-control" placeholder="name@example.com" required autofocus>
            </div>

            <div class="form-group">
                <label class="form-label" for="password">Password</label>
                <input type="password" id="password" class="form-control" placeholder="••••••••" required>
            </div>

            <button type="submit" id="submit-btn" class="btn btn-primary btn-block mt-4">
                Sign In
            </button>
        </form>

        <div class="demo-accounts">
            <div class="demo-title">Quick Demo Sign-in (1-Click)</div>
            <div class="demo-btn-grid">
                <button type="button" class="btn-demo" onclick="fillCredentials('admin@example.com', 'Admin@123')">
                    👑 Admin
                    <span>admin@example.com</span>
                </button>
                <button type="button" class="btn-demo" onclick="fillCredentials('user@example.com', 'User@123')">
                    👤 Normal User
                    <span>user@example.com</span>
                </button>
                <button type="button" class="btn-demo" onclick="fillCredentials('vendor1@example.com', 'Vendor@123')">
                    🏢 Vendor V1 (50%)
                    <span>vendor1@example.com</span>
                </button>
                <button type="button" class="btn-demo" onclick="fillCredentials('vendor2@example.com', 'Vendor@123')">
                    🏢 Vendor V2 (30%)
                    <span>vendor2@example.com</span>
                </button>
            </div>
            <div style="margin-top: 0.5rem;">
                <button type="button" class="btn-demo" style="width: 100%;" onclick="fillCredentials('vendor3@example.com', 'Vendor@123')">
                    🏢 Vendor V3 (20%) <span>vendor3@example.com</span>
                </button>
            </div>
        </div>
    </div>
</div>

<script src="/js/api.js"></script>
<script src="/js/auth.js"></script>
<script>
    if (Auth.isAuthenticated()) {
        const role = Auth.getRole();
        if (role === 'ADMIN') window.location.href = '/admin/dashboard.html';
        else if (role === 'VENDOR') window.location.href = '/vendor/dashboard.html';
        else window.location.href = '/user/dashboard.html';
    }

    function fillCredentials(email, password) {
        document.getElementById('email').value = email;
        document.getElementById('password').value = password;
        document.getElementById('login-form').dispatchEvent(new Event('submit'));
    }

    document.getElementById('login-form').addEventListener('submit', async (e) => {
        e.preventDefault();
        const submitBtn = document.getElementById('submit-btn');
        submitBtn.disabled = true;
        submitBtn.textContent = 'Authenticating...';

        const email = document.getElementById('email').value.trim();
        const password = document.getElementById('password').value;

        try {
            const res = await api.post('/auth/login', { email, password });
            if (res && res.success && res.data) {
                Auth.setSession(res.data);
                showToast('Login successful! Redirecting...', 'success');

                setTimeout(() => {
                    const role = res.data.role;
                    if (role === 'ADMIN') window.location.href = '/admin/dashboard.html';
                    else if (role === 'VENDOR') window.location.href = '/vendor/dashboard.html';
                    else window.location.href = '/user/dashboard.html';
                }, 800);
            }
        } catch (err) {
            submitBtn.disabled = false;
            submitBtn.textContent = 'Sign In';
        }
    });
</script>
</body>
</html>
